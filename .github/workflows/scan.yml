name: Scan

on:
  schedule:
    # Every 30 minutes, Mon-Fri, 14:00-21:59 UTC (covers the US market, 2:30pm-9pm UK time in winter)
    - cron: "*/30 14-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install yfinance pandas

      - name: Run scanner
        run: python scanner.py

      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs/results.json
          git diff --cached --quiet || (git commit -m "Update results" && git push)
