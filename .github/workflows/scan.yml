name: Scan

on:
  schedule:
    # 3 updates a day, Mon-Fri: about 2:45pm, 5:30pm and 8:30pm UK time.
    # Each is listed twice (summer + winter US time); scanner.py skips the wrong one.
    - cron: "45 13,14 * * 1-5"
    - cron: "30 16,17 * * 1-5"
    - cron: "30 19,20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install yfinance pandas

      - name: Run scanner
        run: python scanner.py

      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs/results.json
          git diff --cached --quiet || (git commit -m "Update results" && git pull --rebase && git push)
